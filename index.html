<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GEME3T Admin Dashboard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell" id="shell"></div>
  <script src="/app.js"></script>
  <script>
    document.getElementById("shell").innerHTML = nav("dashboard") + `
      <main class="main"><div class="container">
        <div class="topbar"><h1>Admin Dashboard</h1><span class="badge">Local SQLite</span></div>
        <div class="grid-4" id="stats"></div>
        <div class="card" style="margin-top:12px">
          <h2>Quick Actions</h2>
          <div class="grid-4">
            <a class="btn btn-primary" href="/services.html" style="text-align:center;text-decoration:none">Manage Services</a>
            <a class="btn btn-primary" href="/customers.html" style="text-align:center;text-decoration:none">Manage Customers</a>
            <a class="btn btn-primary" href="/coupons.html" style="text-align:center;text-decoration:none">Manage Coupons</a>
            <a class="btn btn-primary" href="/quotes.html" style="text-align:center;text-decoration:none">New Sale</a>
            <a class="btn btn-primary" href="/finance.html" style="text-align:center;text-decoration:none">Income & Expenses</a>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <div><h2 style="margin-bottom:4px">Sales Operations</h2><small style="color:var(--muted)">Completed and pending service counts</small></div>
            <a class="btn btn-primary" href="/operations.html" style="text-decoration:none">Open Weekly Report</a>
          </div>
          <div class="grid-4" id="salesCounts" style="margin-top:12px"></div>
        </div>
      </div></main>`;
    api("/api/dashboard").then(data => {
      const values = [
        ["Categories", data.categories], ["Services", data.services],
        ["Customers", data.customers], ["Coupons", data.coupons],
        ["Sales", data.quotes], ["Gross Revenue", naira(data.gross)],
        ["Recorded Net Profit", naira(data.net)]
      ];
      document.getElementById("stats").innerHTML = values.map(([label, value]) =>
        `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`
      ).join("");
      document.getElementById("salesCounts").innerHTML = `
        <div class="stat"><small>Completed Sales</small><strong>${data.salesCompleted}</strong></div>
        <div class="stat"><small>Completed Amount</small><strong>${naira(data.completedAmount)}</strong></div>
        <div class="stat"><small>Pending Sales</small><strong>${data.salesPending}</strong></div>
        <div class="stat"><small>Pending Amount</small><strong>${naira(data.pendingAmount)}</strong></div>`;
    });
  </script>
</body>
</html>
